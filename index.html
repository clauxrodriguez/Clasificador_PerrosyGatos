<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>Perros y Gatos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      :root {
        --sky-50: #eefbff;
        --sky-100: #dff6ff;
        --sky-200: #c2ebff;
        --sky-300: #9ad9ff;
        --sky-500: #4ca9db;
        --sky-700: #1c6ea5;
        --sky-900: #0f3f5b;
        --white: #ffffff;
        --text: #153a4d;
        --muted: #587d90;
      }

      body {
        background: linear-gradient(180deg, var(--sky-50) 0%, var(--sky-100) 35%, #f4fbff 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .hero {
        text-align: center;
        padding: 2rem 1rem 1rem;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.65);
        box-shadow: 0 12px 30px rgba(76, 169, 219, 0.15);
        backdrop-filter: blur(2px);
      }

      .hero h1 {
        font-size: clamp(2.4rem, 5vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--sky-900);
        margin-top: 1rem;
      }

      .hero p {
        color: var(--muted);
      }

      .card-panel {
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(124, 189, 233, 0.35);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(38, 124, 170, 0.14);
        padding: 2rem 1.25rem;
        backdrop-filter: blur(6px);
      }

      #video {
        width: 1px;
        height: 1px;
        opacity: 0;
        position: absolute;
        pointer-events: none;
      }

      #canvas {
        width: min(100%, 420px);
        height: auto;
        border-radius: 26px;
        border: 4px solid rgba(76, 169, 219, 0.4);
        background: linear-gradient(135deg, #dfefff, #edf9ff);
        box-shadow: inset 0 0 18px rgba(76, 169, 219, 0.12);
        display: block;
        margin: 0 auto 1rem auto;
      }

      #canvas-frame {
        position: relative;
      }

      #resultado {
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: clamp(2.3rem, 7vw, 5rem);
        letter-spacing: -0.04em;
        text-align: center;
        color: var(--sky-700);
        transition: all 0.25s ease;
      }

      #resultado.buscando {
        color: var(--muted);
        font-size: clamp(1.6rem, 5vw, 2.8rem);
      }

      #resultado.gato {
        color: #296fa3;
      }

      #resultado.perro {
        color: #1786b7;
      }

      .btn-camara {
        background: linear-gradient(135deg, var(--sky-500), var(--sky-700));
        border: none;
        color: var(--white);
        border-radius: 999px;
        padding: 0.8rem 1.4rem;
        font-weight: 600;
        box-shadow: 0 12px 25px rgba(28, 110, 165, 0.25);
        margin-bottom: 1.2rem;
      }

      .btn-camara:hover {
        filter: brightness(1.05);
      }

      .status-chip {
        display: inline-block;
        background: rgba(150, 214, 255, 0.22);
        color: var(--sky-700);
        border: 1px solid rgba(76, 169, 219, 0.28);
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .footer {
        text-align: center;
        margin-top: 2rem;
        background: linear-gradient(180deg, rgba(17, 76, 113, 0.98), rgba(12, 55, 85, 0.98));
        color: rgba(255, 255, 255, 0.9);
        padding: 2.5rem 1rem;
      }

      .footer h2 {
        color: white;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <div class="brand-badge">
          <img src="LogotipoV2-Simple.png" alt="Logo" width="70" height="70">
        </div>
        <h1>Perros y gatos</h1>
        <div class="col-lg-7 mx-auto">
          <p class="lead mb-0">Clasificaci&oacute;n de im&aacute;genes usando tu c&aacute;mara y TensorFlow.js</p>
        </div>
      </div>

      <div class="container mt-3">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card-panel text-center">
              <span class="status-chip">Live detector</span>
              <video id="video" playsinline autoplay></video>
              <button class="btn btn-camara" id="cambiar-camara" onclick="cambiarCamara();">Cambiar c&aacute;mara</button>
              <div id="canvas-frame">
                <canvas id="canvas" width="400" height="400"></canvas>
              </div>
              <canvas id="otrocanvas" width="150" height="150" style="display: none"></canvas>
              <div id="resultado" class="buscando">Buscando...</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <h2>Soporte Toma Des</h2>
        <p class="mb-0">Revisa mi canal para m&aacute;s proyectos de inteligencia artificial y programaci&oacute;n.</p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

  <script type="text/javascript">

    var tamano = 400;
    var video = document.getElementById("video");
    var canvas = document.getElementById("canvas");
    var otrocanvas = document.getElementById("otrocanvas");
    var ctx = canvas.getContext("2d");
    var currentStream = null;
    var facingMode = "user";

    var modelo = null;
    var ultimoResultado = null;
    var ultimoCambioEstado = 0;
    var UMBRAL_CLASIFICACION = 0.7;

    function setResultado(mensaje, tipo) {
      var elemento = document.getElementById("resultado");
      elemento.innerHTML = mensaje;
      elemento.classList.remove("buscando", "gato", "perro");
      if (tipo) {
        elemento.classList.add(tipo);
      } else {
        elemento.classList.add("buscando");
      }
    }

    function dibujarMarco() {
      var ancho = canvas.width;
      var alto = canvas.height;
      var margen = 38;
      var x = margen;
      var y = margen;
      var w = ancho - margen * 2;
      var h = alto - margen * 2;

      ctx.save();
      ctx.strokeStyle = "rgba(120, 210, 255, 0.95)";
      ctx.lineWidth = 4;
      ctx.setLineDash([14, 10]);
      ctx.strokeRect(x, y, w, h);
      ctx.restore();
    }

    function escenaSinObjeto(imgData) {
      var suma = 0;
      var sumaCuadrados = 0;
      var total = 0;

      for (var i = 0; i < imgData.data.length; i += 4) {
        var brillo = (imgData.data[i] + imgData.data[i + 1] + imgData.data[i + 2]) / 3 / 255;
        suma += brillo;
        sumaCuadrados += brillo * brillo;
        total += 1;
      }

      var promedio = suma / total;
      var varianza = (sumaCuadrados / total) - (promedio * promedio);

      return promedio < 0.18 || varianza < 0.003;
    }

    (async() => {
      console.log("Cargando modelo...");
      setResultado("Buscando...", null);
      modelo = await tf.loadLayersModel("model.json");
      console.log("Modelo cargado");
    })();

    window.onload = function() {
      mostrarCamara();
    }

    function mostrarCamara() {
      var opciones = {
        audio: false,
        video: {
          width: tamano, height: tamano
        }
      }

      if (navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia(opciones)
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = currentStream;
              procesarCamara();
              predecir();
            })
            .catch(function(err) {
              alert("No se pudo utilizar la camara :(");
              console.log(err);
              alert(err);
            })
      } else {
        alert("No existe la funcion getUserMedia");
      }
    }

    function cambiarCamara() {
          if (currentStream) {
              currentStream.getTracks().forEach(track => {
                  track.stop();
              });
          }

          facingMode = facingMode == "user" ? "environment" : "user";

          var opciones = {
              audio: false,
              video: {
                  facingMode: facingMode, width: tamano, height: tamano
              }
          };


          navigator.mediaDevices.getUserMedia(opciones)
              .then(function(stream) {
                  currentStream = stream;
                  video.srcObject = currentStream;
              })
              .catch(function(err) {
                  console.log("Oops, hubo un error", err);
              })
      }

    function procesarCamara() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, tamano, tamano, 0, 0, tamano, tamano);
      dibujarMarco();
      setTimeout(procesarCamara, 20);
    }

    function predecir() {
      if (modelo != null) {
        resample_single(canvas, 100, 100, otrocanvas);

        var ctx2 = otrocanvas.getContext("2d");
        var imgData = ctx2.getImageData(0,0, 100, 100);

        if (escenaSinObjeto(imgData)) {
          setResultado("Buscando...", null);
          setTimeout(predecir, 180);
          return;
        }

        var arr = [];
        var arr100 = [];

        for (var p=0; p < imgData.data.length; p+= 4) {
          var rojo = imgData.data[p] / 255;
          var verde = imgData.data[p+1] / 255;
          var azul = imgData.data[p+2] / 255;

          var gris = (rojo+verde+azul)/3;

          arr100.push([gris]);
          if (arr100.length == 100) {
            arr.push(arr100);
            arr100 = [];
          }
        }

        arr = [arr];

        var tensor = tf.tensor4d(arr);
        var salida = modelo.predict(tensor).dataSync();
        var probabilidadPerro = salida[0];

        if (probabilidadPerro >= UMBRAL_CLASIFICACION) {
          setResultado("Perro", "perro");
        } else if (probabilidadPerro <= (1 - UMBRAL_CLASIFICACION)) {
          setResultado("Gato", "gato");
        } else {
          setResultado("Buscando...", null);
        }
      }

      setTimeout(predecir, 180);
    }

    /**
       * Hermite resize - fast image resize/resample using Hermite filter. 1 cpu version!
       * 
       * @param {HtmlElement} canvas
       * @param {int} width
       * @param {int} height
       * @param {boolean} resize_canvas if true, canvas will be resized. Optional.
       * Cambiado por RT, resize canvas ahora es donde se pone el chiqitillllllo
       */
      function resample_single(canvas, width, height, resize_canvas) {
          var width_source = canvas.width;
          var height_source = canvas.height;
          width = Math.round(width);
          height = Math.round(height);

          var ratio_w = width_source / width;
          var ratio_h = height_source / height;
          var ratio_w_half = Math.ceil(ratio_w / 2);
          var ratio_h_half = Math.ceil(ratio_h / 2);

          var ctx = canvas.getContext("2d");
          var ctx2 = resize_canvas.getContext("2d");
          var img = ctx.getImageData(0, 0, width_source, height_source);
          var img2 = ctx2.createImageData(width, height);
          var data = img.data;
          var data2 = img2.data;

          for (var j = 0; j < height; j++) {
              for (var i = 0; i < width; i++) {
                  var x2 = (i + j * width) * 4;
                  var weight = 0;
                  var weights = 0;
                  var weights_alpha = 0;
                  var gx_r = 0;
                  var gx_g = 0;
                  var gx_b = 0;
                  var gx_a = 0;
                  var center_y = (j + 0.5) * ratio_h;
                  var yy_start = Math.floor(j * ratio_h);
                  var yy_stop = Math.ceil((j + 1) * ratio_h);
                  for (var yy = yy_start; yy < yy_stop; yy++) {
                      var dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;
                      var center_x = (i + 0.5) * ratio_w;
                      var w0 = dy * dy; //pre-calc part of w
                      var xx_start = Math.floor(i * ratio_w);
                      var xx_stop = Math.ceil((i + 1) * ratio_w);
                      for (var xx = xx_start; xx < xx_stop; xx++) {
                          var dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;
                          var w = Math.sqrt(w0 + dx * dx);
                          if (w >= 1) {
                              //pixel too far
                              continue;
                          }
                          //hermite filter
                          weight = 2 * w * w * w - 3 * w * w + 1;
                          var pos_x = 4 * (xx + yy * width_source);
                          //alpha
                          gx_a += weight * data[pos_x + 3];
                          weights_alpha += weight;
                          //colors
                          if (data[pos_x + 3] < 255)
                              weight = weight * data[pos_x + 3] / 250;
                          gx_r += weight * data[pos_x];
                          gx_g += weight * data[pos_x + 1];
                          gx_b += weight * data[pos_x + 2];
                          weights += weight;
                      }
                  }
                  data2[x2] = gx_r / weights;
                  data2[x2 + 1] = gx_g / weights;
                  data2[x2 + 2] = gx_b / weights;
                  data2[x2 + 3] = gx_a / weights_alpha;
              }
          }


          ctx2.putImageData(img2, 0, 0);
      }
  </script>
  </body>
</html>
